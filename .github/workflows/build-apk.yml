name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APKs
        run: gradle :app:assembleDebug :publicapp:assembleDebug :dairyapp:assembleDebug :dashboardapp:assembleDebug --stacktrace
      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Animality-Vet-Supply-Admin.apk
          cp publicapp/build/outputs/apk/debug/publicapp-debug.apk Animality-Vet-Supply.apk
          cp dairyapp/build/outputs/apk/debug/dairyapp-debug.apk Dairy-Farm.apk
          cp dashboardapp/build/outputs/apk/debug/dashboardapp-debug.apk Animality-Executive-Dashboard.apk
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Animality-Vet-Supply-Admin-APK
          path: Animality-Vet-Supply-Admin.apk
          if-no-files-found: error
      - name: Upload Public APK
        uses: actions/upload-artifact@v4
        with:
          name: Animality-Vet-Supply-APK
          path: Animality-Vet-Supply.apk
          if-no-files-found: error
      - name: Upload Dairy APK
        uses: actions/upload-artifact@v4
        with:
          name: Dairy-Farm-APK
          path: Dairy-Farm.apk
          if-no-files-found: error
      - name: Upload Executive Dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: Animality-Executive-Dashboard-APK
          path: Animality-Executive-Dashboard.apk
          if-no-files-found: error
